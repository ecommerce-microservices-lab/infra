apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: payment-service-rolebinding
  namespace: prod
  labels:
    app: payment-service
    component: rbac
    managed-by: terraform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: payment-service-role
subjects:
  - kind: ServiceAccount
    name: payment-service
    namespace: prod
