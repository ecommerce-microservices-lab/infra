apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloud-config-rolebinding
  namespace: prod
  labels:
    app: cloud-config
    component: rbac
    managed-by: terraform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloud-config-role
subjects:
  - kind: ServiceAccount
    name: cloud-config
    namespace: prod
