apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-gateway-rolebinding
  namespace: prod
  labels:
    app: api-gateway
    component: rbac
    managed-by: terraform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-gateway-role
subjects:
  - kind: ServiceAccount
    name: api-gateway
    namespace: prod

