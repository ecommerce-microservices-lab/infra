apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: proxy-client-rolebinding
  namespace: prod
  labels:
    app: proxy-client
    component: rbac
    managed-by: terraform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: proxy-client-role
subjects:
  - kind: ServiceAccount
    name: proxy-client
    namespace: prod
