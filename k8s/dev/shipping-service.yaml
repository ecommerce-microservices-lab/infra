apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f compose.yml -o k8s-manifests/
    kompose.version: 1.36.0 (ae2a39403)
  labels:
    io.kompose.service: shipping-service
  name: shipping-service
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: shipping-service
  template:
    metadata:
      labels:
        io.kompose.service: shipping-service
    spec:
      serviceAccountName: shipping-service
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: acr-secret
      containers:
        - env:
            - name: SPRING_CONFIG_IMPORT
              value: optional:configserver:http://cloud-config:9296/
            # H2 en memoria para dev
            - name: SPRING_DATASOURCE_URL
              value: jdbc:h2:mem:shipping_service_db;DB_CLOSE_DELAY=-1;MODE=MYSQL
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: org.h2.Driver
            - name: SPRING_DATASOURCE_USERNAME
              value: sa
            - name: SPRING_DATASOURCE_PASSWORD
              value: ""
            - name: SPRING_JPA_DATABASE_PLATFORM
              value: org.hibernate.dialect.H2Dialect
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: validate
            - name: SPRING_FLYWAY_ENABLED
              value: "true"
            - name: EUREKA_INSTANCE_HOSTNAME
              value: shipping-service
          envFrom:
            - configMapRef:
                name: common-environment-variables
          image: microservicesacr5fa48984.azurecr.io/shipping-service:stage
          imagePullPolicy: Always
          name: shipping-service
          ports:
            - containerPort: 8600
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
              ephemeral-storage: "256Mi"
            limits:
              memory: "512Mi"
              cpu: "300m"
              ephemeral-storage: "512Mi"
          readinessProbe:
            httpGet:
              path: /shipping-service/actuator/health
              port: 8600
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /shipping-service/actuator/health
              port: 8600
            initialDelaySeconds: 150
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: shipping-service
  name: shipping-service
  namespace: dev
spec:
  ports:
    - name: "8600"
      port: 8600
      targetPort: 8600
  selector:
    io.kompose.service: shipping-service
