apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yaml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'gke-prod'
        environment: 'prod'

    # Configuración de Alertmanager
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              - alertmanager.monitoring.svc.cluster.local:9093

    # Reglas de alerta
    rule_files:
      - /etc/prometheus/alerts/*.yml

    scrape_configs:
      # Scraping de servicios a través del API Gateway (en namespace prod)
      - job_name: 'api-gateway'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['api-gateway.prod.svc.cluster.local:8080']
            labels:
              service: 'api-gateway'
              namespace: 'prod'

      - job_name: 'user-service'
        metrics_path: /user-service/actuator/prometheus
        static_configs:
          - targets: ['api-gateway.prod.svc.cluster.local:8080']
            labels:
              service: 'user-service'
              namespace: 'prod'

      - job_name: 'order-service'
        metrics_path: /order-service/actuator/prometheus
        static_configs:
          - targets: ['api-gateway.prod.svc.cluster.local:8080']
            labels:
              service: 'order-service'
              namespace: 'prod'

      - job_name: 'payment-service'
        metrics_path: /payment-service/actuator/prometheus
        static_configs:
          - targets: ['api-gateway.prod.svc.cluster.local:8080']
            labels:
              service: 'payment-service'
              namespace: 'prod'

      - job_name: 'product-service'
        metrics_path: /product-service/actuator/prometheus
        static_configs:
          - targets: ['api-gateway.prod.svc.cluster.local:8080']
            labels:
              service: 'product-service'
              namespace: 'prod'

      - job_name: 'shipping-service'
        metrics_path: /shipping-service/actuator/prometheus
        static_configs:
          - targets: ['api-gateway.prod.svc.cluster.local:8080']
            labels:
              service: 'shipping-service'
              namespace: 'prod'

      - job_name: 'favourite-service'
        metrics_path: /favourite-service/actuator/prometheus
        static_configs:
          - targets: ['api-gateway.prod.svc.cluster.local:8080']
            labels:
              service: 'favourite-service'
              namespace: 'prod'

      - job_name: 'proxy-client'
        metrics_path: /app/actuator/prometheus
        static_configs:
          - targets: ['api-gateway.prod.svc.cluster.local:8080']
            labels:
              service: 'proxy-client'
              namespace: 'prod'

      - job_name: 'service-discovery'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['service-discovery.prod.svc.cluster.local:8761']
            labels:
              service: 'service-discovery'
              namespace: 'prod'

      - job_name: 'cloud-config'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['cloud-config.prod.svc.cluster.local:9296']
            labels:
              service: 'cloud-config'
              namespace: 'prod'

      # Scraping de Prometheus mismo (auto-monitoring)
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.48.0
          args:
            - '--config.file=/etc/prometheus/prometheus.yaml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=30d'
            - '--web.console.libraries=/usr/share/prometheus/console_libraries'
            - '--web.console.templates=/usr/share/prometheus/consoles'
            - '--web.enable-lifecycle'
          ports:
            - name: web
              containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
            - name: prometheus-alerts
              mountPath: /etc/prometheus/alerts
            - name: prometheus-storage
              mountPath: /prometheus
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-alerts
          configMap:
            name: prometheus-alerts
        - name: prometheus-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: 9090

