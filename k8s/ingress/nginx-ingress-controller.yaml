# NGINX Ingress Controller para GCP GKE
# Este manifiesto instala el NGINX Ingress Controller usando Helm
# Para instalarlo manualmente:
# helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
# helm repo update
# helm install ingress-nginx ingress-nginx/ingress-nginx \
#   --namespace ingress-nginx \
#   --create-namespace \
#   --set controller.service.type=LoadBalancer \
#   --set controller.service.annotations."cloud\.google\.com/load-balancer-type"="External" \
#   --set controller.admissionWebhooks.enabled=false

# Alternativamente, se puede instalar usando kubectl apply con el manifiesto oficial:
# kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.2/deploy/static/provider/cloud/deploy.yaml

# Nota: Para producción, se recomienda usar Helm para mayor control sobre la configuración

