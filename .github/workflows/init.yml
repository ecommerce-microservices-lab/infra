name: Deploy infrastructure

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0

      - name: Set Azure Credentials
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV

      # AWS not used in this setup
      # - name: Set AWS Credentials
      #   run: |
      #     echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
      #     echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV

      - name: Set GCP Credentials (if available)
        run: |
          if [ -n "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" ]; then
            echo "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" > /tmp/gcp-key.json
            echo "✅ GCP credentials file created"
          else
            echo "⚠️  GCP credentials not configured, skipping..."
          fi

      - name: Terraform Init
        working-directory: terraform/
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/
        run: |
          # Determinar qué recursos aplicar basado en los secrets disponibles
          if [ -n "${{ secrets.GCP_PROJECT_ID }}" ] && [ -f /tmp/gcp-key.json ] && [ -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "🟢 Aplicando todos los recursos (Azure + GCP)..."
            # Nota: Si Azure AKS está pausado, la creación de namespace_dev fallará, pero eso está bien
            # Los namespaces ya deberían existir de ejecuciones anteriores
            terraform apply -auto-approve \
              -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
              -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
              -var="client_secret=${{ secrets.AZURE_CLIENT_SECRET }}" \
              -var="client_id=${{ secrets.AZURE_CLIENT_ID }}" \
              -var="gcp_project_id=${{ secrets.GCP_PROJECT_ID }}" \
              -var="gcp_credentials_path=/tmp/gcp-key.json" || {
                EXIT_CODE=$?
                echo "⚠️  Terraform apply falló con código $EXIT_CODE"
                echo "⚠️  Esto puede ser porque Azure AKS está pausado (los namespaces ya deberían existir)"
                echo "⚠️  Continuando con el despliegue..."
              }
          elif [ -n "${{ secrets.GCP_PROJECT_ID }}" ] && [ -f /tmp/gcp-key.json ]; then
            echo "🔵 Aplicando solo recursos de GCP (Azure no configurado)..."
            terraform apply -auto-approve \
              -var="gcp_project_id=${{ secrets.GCP_PROJECT_ID }}" \
              -var="gcp_credentials_path=/tmp/gcp-key.json" \
              -target=module.gke_prod \
              -target=module.namespace_prod
          elif [ -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "🔵 Aplicando solo recursos de Azure (GCP no configurado)..."
            echo "⚠️  NOTA: Si Azure AKS está pausado, la creación de namespace_dev fallará."
            echo "⚠️  Los namespaces ya deberían existir de ejecuciones anteriores."
            # Intentar aplicar, pero no fallar si Azure está pausado
            terraform apply -auto-approve \
              -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
              -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
              -var="client_secret=${{ secrets.AZURE_CLIENT_SECRET }}" \
              -var="client_id=${{ secrets.AZURE_CLIENT_ID }}" \
              -target=module.aks \
              -target=azurerm_resource_group.microservices_rg \
              -target=azurerm_container_registry.microservices_acr \
              -target=random_id.acr_suffix \
              -target=module.namespace_dev || {
                EXIT_CODE=$?
                echo "⚠️  Terraform apply falló con código $EXIT_CODE"
                echo "⚠️  Esto puede ser porque Azure AKS está pausado (los namespaces ya deberían existir)"
                echo "⚠️  Continuando con el despliegue..."
              }
          else
            echo "❌ Error: No hay credenciales configuradas para Azure ni GCP"
            exit 1
          fi

      - name: Get Terraform Outputs
        id: tf_outputs
        working-directory: terraform/
        run: |
          echo "acr_name=$(terraform output -raw acr_name)" >> $GITHUB_OUTPUT
          echo "acr_admin_username=$(terraform output -raw acr_admin_username)" >> $GITHUB_OUTPUT
          echo "acr_admin_password=$(terraform output -raw acr_admin_password)" >> $GITHUB_OUTPUT
          echo "acr_login_server=$(terraform output -raw acr_login_server)" >> $GITHUB_OUTPUT
          echo "resource_group_name=$(terraform output -raw resource_group_name)" >> $GITHUB_OUTPUT

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: >-
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }
          auth-type: SERVICE_PRINCIPAL

      - name: Clear Azure CLI MSAL cache
        run: rm -f ~/.azure/msal_http_cache.bin

      - name: Upgrade Azure CLI to latest
        run: |
          az upgrade --yes
          az version

      - name: Install GitHub CLI
        run: sudo apt-get install gh -y

      - name: Authenticate with GitHub CLI
        run: echo "${{ secrets.GH_PAT }}" | gh auth login --with-token

      - name: Set Organization Secrets for multiple repositories
        run: |
          gh secret set ACR_NAME --org ecommerce-microservices-lab -b "${{ steps.tf_outputs.outputs.acr_name }}" --visibility "all"
          gh secret set ACR_USERNAME --org ecommerce-microservices-lab -b "${{ steps.tf_outputs.outputs.acr_admin_username }}" --visibility "all"
          gh secret set ACR_PASSWORD --org ecommerce-microservices-lab -b "${{ steps.tf_outputs.outputs.acr_admin_password }}" --visibility "all"
          gh secret set RESOURCE_GROUP --org ecommerce-microservices-lab -b "${{ steps.tf_outputs.outputs.resource_group_name }}" --visibility "all"

      # - name: Trigger workflows for multiple branches and wait for completion
      #   run: |
