      #     echo "🎉 All workflows completed on all branches."

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"


      # - name: Attach ACR to each AKS cluster
      #   run: |
      #     aks_names=("microservices-cluster-prod" "microservices-cluster-devops" "microservices-cluster-stage")

      #     for cluster_name in "${aks_names[@]}"; do
      #       echo "🔗 Attaching ACR to cluster: $cluster_name"

      #       az aks update \
      #         --resource-group "${{ steps.tf_outputs.outputs.resource_group_name }}" \
      #         --name "$cluster_name" \
      #         --attach-acr "${{ steps.tf_outputs.outputs.acr_name }}"
      #     done

      - name: Add ConfigMap and Deploy Zipkin, Service Discovery, Redis Cache and Cloud Config (per ENV)
        run: |
          export ACR_NAME="${{ steps.tf_outputs.outputs.acr_name }}"

          # Mapear cluster a entorno
          # IMPORTANTE: El nombre del cluster "microservices-cluster-prod" es confuso pero es el nombre real del cluster en Azure.
          # Este cluster NO es para producción, se usa para DEV y STAGE (diferenciados por tags de imagen Docker).
          # Por eso se mapea al namespace "dev", no "prod".
          # 
          # Estrategia de 2 ambientes:
          # - Azure AKS (microservices-cluster-prod) → namespace "dev" → para dev y stage (tags :dev y :stage)
          # - GCP GKE (microservices-cluster-gke-prod) → namespace "prod" → para producción (tag :prod)
          declare -A env_map=(
            ["microservices-cluster-prod"]="dev"  # Cluster Azure → namespace dev (dev/stage)
          )

          aks_names=("microservices-cluster-prod")

          for cluster_name in "${aks_names[@]}"; do
            echo "🔧 Switching context to cluster: $cluster_name"

            az aks get-credentials \
              --resource-group "${{ steps.tf_outputs.outputs.resource_group_name }}" \
              --name "$cluster_name" \
              --overwrite-existing

            export ENV="${env_map[$cluster_name]}"
            echo "🚀 Deploying initial services to: $cluster_name (ENV=$ENV)"

            # Verificar que el namespace existe
            # Nota: Los namespaces ya deberían existir de ejecuciones anteriores de terraform apply
            # Si el cluster está pausado (Azure) o tiene 0 nodos (GCP), los namespaces persisten
            if ! kubectl get ns "$ENV" >/dev/null 2>&1; then
              echo "⚠️  Namespace '$ENV' no existe. Creando namespace básico como fallback..."
              echo "⚠️  NOTA: Este namespace NO tendrá ResourceQuota, LimitRange ni NetworkPolicy."
              echo "⚠️  Para aplicar las políticas correctas, ejecuta 'terraform apply' cuando el cluster esté activo."
              kubectl create ns "$ENV" || {
                echo "❌ No se pudo crear el namespace. El cluster puede estar pausado o inaccesible."
                exit 1
              }
              echo "✅ Namespace '$ENV' creado (básico, sin políticas de Terraform)"
            else
              echo "✅ Namespace '$ENV' existe"
              # Verificar si tiene las políticas de Terraform (ResourceQuota)
              if kubectl get resourcequota -n "$ENV" >/dev/null 2>&1; then
                echo "✅ Namespace '$ENV' tiene políticas de Terraform aplicadas (ResourceQuota/LimitRange/NetworkPolicy)"
              else
                echo "⚠️  Namespace '$ENV' existe pero NO tiene políticas de Terraform"
                echo "⚠️  Ejecuta 'terraform apply' cuando el cluster esté activo para aplicar las políticas."
              fi
            fi

            # Aplicar recursos core: si existe en carpeta del ENV, usarlo; si no, usar base
            for file in redis-cache.yaml configmap.yaml zipkin.yaml service-discovery.yaml cloud-config.yaml mysql-secret.yaml mysql.yaml; do
              if [ -f "infra/k8s/$ENV/$file" ]; then
                envsubst < "infra/k8s/$ENV/$file" | kubectl apply -f -
              elif [ -f "infra/k8s/base/$file" ]; then
                envsubst < "infra/k8s/base/$file" | kubectl apply -f -
              fi
            done

            echo "⏳ Esperando 60 segundos para que los servicios estén listos en $cluster_name..."
            sleep 60
          done

      - name: Deploy Remaining Services (per ENV)
        run: |
          export ACR_NAME="${{ steps.tf_outputs.outputs.acr_name }}"

          # Mapear cluster a entorno
          # IMPORTANTE: El cluster "microservices-cluster-prod" (Azure) se mapea a namespace "dev"
          # porque se usa para dev/stage (diferenciados por tags), NO para producción.
          # Producción está en GCP GKE con namespace "prod".
          declare -A env_map=(
            ["microservices-cluster-prod"]="dev"  # Cluster Azure → namespace dev (dev/stage)
          )

          aks_names=("microservices-cluster-prod")

          for cluster_name in "${aks_names[@]}"; do
            echo "🔧 Switching context to cluster: $cluster_name"

            az aks get-credentials \
              --resource-group "${{ steps.tf_outputs.outputs.resource_group_name }}" \
              --name "$cluster_name" \
              --overwrite-existing

            export ENV="${env_map[$cluster_name]}"
            echo "🚀 Deploying remaining services to: $cluster_name (ENV=$ENV)"

            # Aplicar todos los servicios propios del ENV, excluyendo core ya aplicados
            for file in infra/k8s/$ENV/*.yaml; do
              base_file=$(basename "$file")
              if [[ "$base_file" != "redis-cache.yaml" && "$base_file" != "mysql-secret.yaml" && "$base_file" != "mysql.yaml" && "$base_file" != "configmap.yaml" && "$base_file" != "zipkin.yaml" && "$base_file" != "service-discovery.yaml" && "$base_file" != "cloud-config.yaml" ]]; then
                envsubst < "$file" | kubectl apply -f -
              fi
            done

            echo "🌐 Esperando a que se asigne IP pública al API Gateway ($ENV)..."
            for i in {1..10}; do
              IP=$(kubectl get svc api-gateway --namespace="$ENV" -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
              if [[ -n "$IP" ]]; then
                break
              fi
              echo "⏳ Intento $i: esperando IP..."
              sleep 10
            done

            if [[ -z "$IP" ]]; then
              echo "❌ No se pudo obtener IP del API Gateway en $ENV"
              exit 1
            fi

            export API_GATEWAY_IP_UPPER=$(echo "$ENV" | tr '[:lower:]' '[:upper:]')
            export API_GATEWAY_IP_VAR="API_GATEWAY_IP_$API_GATEWAY_IP_UPPER"
            echo "$API_GATEWAY_IP_VAR=$IP" >> $GITHUB_ENV
          done

